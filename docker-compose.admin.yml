services:
  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://app:8000
    restart: unless-stopped
    networks:
      - bot_network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - admin-panel
    ports:
      - "80:80"
    volumes:
      - ./nginx/admin-panel.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - bot_network

networks:
  bot_network:
    external: true
    name: 19-step_default
